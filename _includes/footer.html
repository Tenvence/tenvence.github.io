<footer class="site-footer">
  <p class="site-footer__legal">
    &copy; {{ site.time | date: "%Y" }}
    <span class="site-footer__dot" aria-hidden="true">&middot;</span>
    {{ site.author.name | split: "(" | first | strip }}
    <span class="site-footer__dot" aria-hidden="true">&middot;</span>
    {{ site.title }}
  </p>
</footer>
